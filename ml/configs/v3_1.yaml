tag: v3_1
# M-v3.1: corrective fine-tune of M-v3 (D-038/D-039).
# The v3 embedding learned a pan shortcut: every hard pair was panned hard
# left/right, so the side channel carried the separation and mono scenario
# audio (S04/S06/S10) collapsed to one embedding. The mixer now also builds
# co-located pairs and 2-3 tone triads, and drum_bed/pitch_noise take a smaller
# share so the pitch head stops hedging on clean tonal content.
#
# Same architecture and ONNX contract as v3; warm start from the v3 EMA
# checkpoint, low LR, short schedule. Val set seeds are unchanged, so the
# sel_* metrics stay comparable with the v3 run.
arch: v3
hid: 208
steps: 1600
batch_size: 8
lr: 2.0e-4
wd: 1.0e-4
warmup: 120
seconds: 4.0
max_sources: 8
amp: true
clip: 1.0
skip_loss: 25.0
seed: 0
init_from: models/v3/ckpt_best.pt

real: true
stereo: true
hard_p: 0.30
stage_a_steps: 0
proc_share_start: 0.40
proc_share_end: 0.45
real_workers: 0
real_batch: 16
mix_distort_p: 0.5

val_batch: 8
val_proc_examples: 120
val_real_examples: 120
val_hard_examples: 48
val_seed: 777
val_cell_acc: true
val_noise: 0.03

pitch_loss: pos_weight
pitch_pos_weight_max: 20.0
uncertainty: true
# keep the loss balance the 7000-step run converged to (dc/act/pitch/sal)
log_var_init: [-1.7442, -3.0229, -0.4831, -2.6078]
dc_margin_db: 3.0

ema_decay: 0.999
log_every: 20
ckpt_every: 400
auto_recover: 20
patience_val: 2
early_stop: 3
