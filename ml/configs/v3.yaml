tag: v3
# M-v3: harmonic-prior input, depthwise-separable encoder, slim shared decoder,
# stereo real stems and hard cases (close pairs, pitch under noise, drum bed).
arch: v3
hid: 208
steps: 7000
batch_size: 8
lr: 1.0e-3
wd: 1.0e-4
warmup: 800
seconds: 4.0
max_sources: 8
amp: true
clip: 1.0
skip_loss: 25.0
seed: 0

# Stage A: procedural + hard cases, then real examples 25% -> 50%
real: true
stereo: true
hard_p: 0.35
stage_a_steps: 1200
proc_share_start: 0.75
proc_share_end: 0.50
real_workers: 0          # in-process stereo reads; verified in preflight (no DataLoader spawn risk)
real_batch: 16
mix_distort_p: 0.5

# fixed validation: same proc/real sets as v1/v2.1 for comparability,
# plus hard cases for the new failure modes
val_batch: 8
val_proc_examples: 120
val_real_examples: 120
val_hard_examples: 48
val_seed: 777
val_cell_acc: true
val_noise: 0.03

# losses
pitch_loss: pos_weight
pitch_pos_weight_max: 20.0
uncertainty: true
log_var_init: [0.0, 0.0, 0.0, 0.0]
dc_margin_db: 3.0

# optimisation / protocol
ema_decay: 0.999
log_every: 20
ckpt_every: 1000
auto_recover: 20
patience_val: 2
early_stop: 3
