tag: v3_2
# M-v3.2: corrective fine-tune of M-v3.1 (D-040).
# v3.1 fixed the pan shortcut and the S06 pitch confidence, but a solo wideband
# source is split into two objects (S05 saw at ~890 Hz, S07 noise at ~890 Hz).
# Root cause measured on the checkpoints: every training example (`_mixed`,
# `_one`, all hard families) has K>=2 sources, and no timbre reaches past
# ~2.2 kHz, so the nets never saw one source owning a wide bright band.
# This run adds a `solo` family (bright 1/n series to 12 kHz, coloured noise)
# and cuts the triad share that taught "wide interval -> separate object".
#
# Same architecture and ONNX contract; warm start from the v3.1 EMA checkpoint.
# The val mixer draws the same new family, so sel_* is comparable inside this
# run but not against v3/v3.1 (D-040).
arch: v3
hid: 208
steps: 900
batch_size: 8
lr: 1.0e-4
wd: 1.0e-4
warmup: 80
seconds: 4.0
max_sources: 8
amp: true
clip: 1.0
skip_loss: 25.0
seed: 0
init_from: models/v3_1/ckpt_best.pt

real: true
stereo: true
hard_p: 0.30
stage_a_steps: 0
proc_share_start: 0.40
proc_share_end: 0.45
real_workers: 0
real_batch: 16
mix_distort_p: 0.5

val_batch: 8
val_proc_examples: 120
val_real_examples: 120
val_hard_examples: 48
val_seed: 777
val_cell_acc: true
val_noise: 0.03

pitch_loss: pos_weight
pitch_pos_weight_max: 20.0
uncertainty: true
# keep the loss balance v3.1 converged to (dc/act/pitch/sal)
log_var_init: [-1.7442, -3.0229, -0.4831, -2.6078]
dc_margin_db: 3.0

ema_decay: 0.999
log_every: 20
ckpt_every: 300
auto_recover: 20
patience_val: 2
early_stop: 3
